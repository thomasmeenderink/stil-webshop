<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — STIL</title>
  <meta name="description" content="Bekijk de volledige collectie van STIL: T-shirts, hoodies, broeken, jassen en accessoires.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" src="js/filters.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Naar de inhoud</a>
  <header class="site-header" data-site-header></header>

  <main id="main" class="container">
    <div class="page-head">
      <p class="eyebrow">Collectie</p>
      <h1 class="page-title" data-shop-title>Alles</h1>
    </div>

    <div class="shop">
      <aside aria-label="Filters">
        <form class="filters" id="filters" data-filters role="search" aria-label="Producten zoeken en filteren">
          <div class="search">
            <label class="visually-hidden" for="q">Zoek in de collectie</label>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6"/></svg>
            <input class="input" type="search" id="q" name="q" placeholder="Zoeken…" autocomplete="off">
          </div>

          <fieldset class="filter-group">
            <legend>Categorie</legend>
            <div data-options="cat"></div>
          </fieldset>

          <fieldset class="filter-group">
            <legend>Maat</legend>
            <div class="chip-list" data-options="maat"></div>
          </fieldset>

          <fieldset class="filter-group">
            <legend>Kleur</legend>
            <div class="chip-list" data-options="kleur"></div>
          </fieldset>

          <fieldset class="filter-group">
            <legend>Prijs</legend>
            <div class="price-range">
              <div>
                <label for="min">Van (€)</label>
                <input class="input" type="number" id="min" name="min" min="0" step="1" inputmode="numeric">
              </div>
              <div>
                <label for="max">Tot (€)</label>
                <input class="input" type="number" id="max" name="max" min="0" step="1" inputmode="numeric">
              </div>
            </div>
          </fieldset>

          <fieldset class="filter-group">
            <legend>Speciaal</legend>
            <div data-options="label"></div>
          </fieldset>

          <div class="stack-sm">
            <button class="btn btn--block filters-done" type="button" data-filters-done>Bekijk resultaten</button>
            <button class="btn btn--outline btn--block" type="reset" data-clear>Alle filters wissen</button>
          </div>
        </form>
      </aside>

      <section aria-labelledby="results-title">
        <h2 class="visually-hidden" id="results-title">Producten</h2>
        <div class="toolbar">
          <button class="btn btn--outline filters-toggle" type="button" aria-expanded="false" aria-controls="filters" data-filters-toggle>
            Filters <span data-filter-count></span>
          </button>
          <p class="toolbar__count" data-result-count aria-live="polite" aria-atomic="true"></p>
          <label class="visually-hidden" for="sort">Sorteren op</label>
          <select class="select select--inline" id="sort" name="sort" form="filters">
            <option value="aanbevolen">Aanbevolen</option>
            <option value="nieuwste">Nieuwste</option>
            <option value="prijs-op">Prijs: laag naar hoog</option>
            <option value="prijs-af">Prijs: hoog naar laag</option>
            <option value="naam">Naam (A–Z)</option>
          </select>
        </div>
        <div class="active-filters" data-active-filters aria-label="Actieve filters"></div>
        <ul class="grid" data-results aria-busy="true">
          <li><div class="skeleton"></div></li><li><div class="skeleton"></div></li><li><div class="skeleton"></div></li>
          <li><div class="skeleton"></div></li><li><div class="skeleton"></div></li><li><div class="skeleton"></div></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
